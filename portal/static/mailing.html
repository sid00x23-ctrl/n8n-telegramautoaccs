<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-tg-agent — Рассылка</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(8,8,15,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      color: var(--text-2); text-decoration: none; font-size: 14px;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--text); }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 16px;
    }
    .header-logo span { color: var(--text-2); font-weight: 400; font-size: 14px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .username-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      color: var(--text-2);
    }
    .username-chip .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .main {
      padding-top: 60px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content {
      width: 100%;
      max-width: 1040px;
      padding: 40px 24px;
    }

    .greeting {
      text-align: center;
      margin-bottom: 48px;
    }
    .greeting h2 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -.03em;
      margin-bottom: 8px;
    }
    .greeting p {
      font-size: 16px;
      color: var(--text-2);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .choice-card {
      position: relative;
      padding: 32px 28px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      overflow: hidden;
    }
    .choice-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s;
    }
    .choice-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-h);
    }
    .choice-card:hover::before { opacity: 1; }
    .choice-card:active { transform: translateY(-2px); }

    /* Accounts card — cyan glow */
    .card-accounts::before { background: radial-gradient(circle at 50% 0%, rgba(0,212,255,0.06) 0%, transparent 70%); }
    .card-accounts:hover { box-shadow: 0 12px 40px rgba(0,212,255,0.12), var(--shadow); }
    .card-accounts .card-icon-wrap { background: var(--primary-dim); border-color: rgba(0,212,255,0.2); }
    .card-accounts:hover .card-arrow { color: var(--primary); }

    /* Dialogs card — green glow */
    .card-dialogs::before { background: radial-gradient(circle at 50% 0%, rgba(34,197,94,0.06) 0%, transparent 70%); }
    .card-dialogs:hover { box-shadow: 0 12px 40px rgba(34,197,94,0.12), var(--shadow); }
    .card-dialogs .card-icon-wrap { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.25); }
    .card-dialogs:hover .card-arrow { color: var(--success); }

    .card-icon-wrap {
      width: 56px; height: 56px;
      border-radius: 14px;
      border: 1px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.5;
    }
    .card-arrow {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
      transition: color .2s, gap .2s;
    }
    .choice-card:hover .card-arrow { gap: 10px; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <header class="header">
    <div class="header-left">
      <a href="/dashboard" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 8H3M7 4l-4 4 4 4"/>
        </svg>
        Назад
      </a>
      <div style="width:1px;height:20px;background:var(--border)"></div>
      <div class="header-logo">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
          <path d="M22 11.5l-8 4.5-4-2.25v5l4 2.25 8-4.5V11.5z" fill="url(#mh1)"/>
          <defs>
            <linearGradient id="mh1" x1="10" y1="11" x2="30" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00d4ff"/><stop offset="1" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="grad-text" style="font-weight:700">ai-tg-agent</span>
        <span>/ Рассылка</span>
      </div>
    </div>
    <div class="header-right">
      <div class="username-chip">
        <span class="dot"></span>
        <span id="usernameLabel">...</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <main class="main page">
    <div class="content">
      <div class="greeting fade-up">
        <h2>Рассылка</h2>
        <p>Выберите раздел для работы</p>
      </div>

      <div class="cards-grid">
        <a href="/service" class="card choice-card card-accounts fade-up delay-1">
          <div class="card-icon-wrap">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="card-body">
            <div class="card-title">Аккаунты</div>
            <div class="card-desc">Управление Telegram-аккаунтами: авторизация, добавление, статус соединений</div>
          </div>
          <div class="card-arrow">
            Открыть
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M9 4l4 4-4 4"/>
            </svg>
          </div>
        </a>

        <a href="/chat" class="card choice-card card-dialogs fade-up delay-2">
          <div class="card-icon-wrap">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div class="card-body">
            <div class="card-title">Диалоги</div>
            <div class="card-desc">Просмотр переписки и отправка сообщений через Telegram-аккаунты</div>
          </div>
          <div class="card-arrow">
            Открыть
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M9 4l4 4-4 4"/>
            </svg>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script type="module">
    import { guardAuth, logout } from '/static/js/api.js';

    const data = await guardAuth();

    document.getElementById('usernameLabel').textContent = data.username;

    document.getElementById('logoutBtn').addEventListener('click', () => logout());
  </script>
</body>
</html>
