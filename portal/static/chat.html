<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotRassilka — Диалоги</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }

    .layout { display: flex; flex-direction: column; height: 100vh; }

    .header {
      height: 60px;
      background: rgba(8,8,15,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
      position: relative;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      color: var(--text-2); text-decoration: none; font-size: 14px;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--text); }

    .chat-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: rgba(8,8,15,0.5);
    }
    .sidebar-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 12px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--primary); }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-btn {
      flex: 1;
      padding: 5px 10px;
      font-size: 11px;
      font-family: var(--font);
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      text-align: center;
    }
    .filter-btn.active {
      background: rgba(0,212,255,0.1);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }
    .filter-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .d-account-badge {
      font-size: 10px;
      color: var(--primary);
      opacity: 0.75;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dialogs-list { flex: 1; overflow-y: auto; }
    .dialogs-list::-webkit-scrollbar { width: 4px; }
    .dialogs-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .dialog-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .dialog-item:hover { background: var(--surface); }
    .dialog-item.active { background: var(--primary-dim); border-left: 2px solid var(--primary); padding-left: 12px; }

    .d-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      flex-shrink: 0; color: #fff;
      text-transform: uppercase;
    }
    .d-info { flex: 1; min-width: 0; }
    .d-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .d-preview { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .d-meta { text-align: right; flex-shrink: 0; }
    .d-time { font-size: 11px; color: var(--text-3); }
    .d-badge {
      display: inline-block;
      background: var(--primary); color: #000;
      border-radius: 10px;
      font-size: 10px; font-weight: 700;
      padding: 1px 5px;
      margin-top: 3px;
    }

    /* ── Messages panel ── */
    .messages-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-size: 15px;
      flex-direction: column;
      gap: 12px;
    }
    .chat-empty .icon { font-size: 48px; opacity: .25; }

    .chat-active { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .chat-active.visible { display: flex; }

    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header-info .ch-name { font-size: 15px; font-weight: 600; }
    .chat-header-info .ch-sub { font-size: 12px; color: var(--text-2); margin-top: 1px; }

    .messages-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .messages-body::-webkit-scrollbar { width: 4px; }
    .messages-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      max-width: 68%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.out {
      align-self: flex-end;
      background: rgba(0,212,255,0.12);
      border: 1px solid rgba(0,212,255,0.2);
      border-bottom-right-radius: 4px;
    }
    .msg.in {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: var(--text-3);
      margin-top: 3px;
      text-align: right;
    }
    .msg.in .msg-time { text-align: left; }

    .msg-input-wrap {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .msg-textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color .2s;
      line-height: 1.4;
    }
    .msg-textarea:focus { border-color: var(--primary); }

    .account-sel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      padding: 6px 10px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
      display: flex; align-items: center;
    }
    .refresh-btn:hover { color: var(--primary); border-color: var(--primary); }

    /* ── Message wrappers with hover actions ── */
    .msg-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .msg-wrapper.out {
      align-self: flex-end;
      flex-direction: row;
      max-width: 72%;
    }
    .msg-wrapper.in {
      align-self: flex-start;
      max-width: 68%;
    }
    .msg-wrapper .msg {
      align-self: unset;
      max-width: 100%;
    }

    .msg-actions {
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .msg-wrapper:hover .msg-actions { opacity: 1; }

    .msg-action-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-2);
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
      padding: 0;
    }
    .msg-action-btn:hover { color: var(--primary); border-color: var(--primary); background: rgba(0,212,255,0.08); }
    .msg-action-btn.del:hover { color: #ff4d4d; border-color: #ff4d4d; background: rgba(255,77,77,0.08); }

    /* ── Inline edit mode ── */
    .msg-edit-wrap { display: flex; flex-direction: column; gap: 6px; }
    .msg-edit-textarea {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--primary);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      padding: 8px 12px;
      resize: none;
      min-height: 60px;
      outline: none;
      line-height: 1.5;
      width: 100%;
      box-sizing: border-box;
    }
    .msg-edit-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .msg-edit-save {
      background: var(--primary); color: #000;
      border: none; border-radius: 6px;
      padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .msg-edit-cancel {
      background: var(--surface); color: var(--text-2);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 12px; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="bg-mesh"></div>

<div class="layout">
  <header class="header">
    <div class="header-left">
      <a href="/dashboard" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Назад
      </a>
      <span style="color:var(--border)">|</span>
      <span style="font-size:16px;font-weight:600">Диалоги</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <select id="accountSel" class="account-sel">
        <option value="">Загрузка...</option>
      </select>
      <button class="refresh-btn" id="refreshDialogsBtn" title="Обновить диалоги">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="chat-wrap">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-search">
        <input id="searchInput" class="search-input" type="text" placeholder="Поиск по имени...">
        <div class="filter-row">
          <button class="filter-btn active" id="filterSent" onclick="setFilter(true)">С приветствием</button>
          <button class="filter-btn" id="filterAll" onclick="setFilter(false)">Все диалоги</button>
        </div>
      </div>
      <div class="dialogs-list" id="dialogsList">
        <div style="padding:40px;text-align:center;color:var(--text-3);font-size:13px">Выберите аккаунт</div>
      </div>
    </div>

    <!-- Messages panel -->
    <div class="messages-panel">
      <div class="chat-empty" id="chatEmpty">
        <div class="icon">💬</div>
        <span>Выберите диалог</span>
      </div>

      <div class="chat-active" id="chatActive">
        <div class="chat-header">
          <div class="d-avatar" id="chatAvatar" style="width:36px;height:36px;font-size:14px">?</div>
          <div class="chat-header-info">
            <div class="ch-name" id="chatName">—</div>
            <div class="ch-sub" id="chatSub">—</div>
          </div>
          <button class="refresh-btn" onclick="loadMessages(true)" title="Обновить" style="margin-left:auto">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>

        <div class="messages-body" id="msgsBody"></div>

        <div class="msg-input-wrap">
          <textarea id="msgInput" class="msg-textarea" rows="1"
            placeholder="Сообщение... (Enter — отправить, Shift+Enter — новая строка)"></textarea>
          <button class="btn btn-primary" id="sendBtn" onclick="sendMsg()" style="height:40px;padding:0 14px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { guardAuth, api, toast } from '/static/js/api.js';

await guardAuth().catch(() => null);

let currentAccount = null;
let currentChat    = null;
let allDialogs     = [];
let lastMsgId      = 0;
let pollTimer      = null;
let sentOnly       = true;
let allAccountsMode = false;
let authorizedAccounts = [];

// ── Accounts ───────────────────────────────────────────────────────────────
async function loadAccounts() {
  try {
    const accounts = await api('GET', '/api/accounts');
    authorizedAccounts = accounts.filter(a => a.authorized);
    const sel = document.getElementById('accountSel');
    if (authorizedAccounts.length === 0) {
      sel.innerHTML = '<option value="">Нет авторизованных аккаунтов</option>';
      return;
    }
    sel.innerHTML =
      '<option value="__all__">Все аккаунты</option>' +
      authorizedAccounts.map(a =>
        `<option value="${a.account_id}">${a.name || a.account_id}${a.username ? ' · @' + a.username : ''}</option>`
      ).join('');
    await selectAccount('__all__');
  } catch (e) {
    toast('Ошибка загрузки аккаунтов: ' + e.message, 'err');
  }
}

async function selectAccount(id) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  allAccountsMode = (id === '__all__');
  currentAccount  = allAccountsMode ? null : id;
  currentChat     = null;
  lastMsgId       = 0;

  // В режиме "все аккаунты" только sent_only доступен
  if (allAccountsMode) {
    sentOnly = true;
    document.getElementById('filterSent').classList.add('active');
    document.getElementById('filterAll').classList.remove('active');
    document.getElementById('filterAll').disabled = true;
  } else {
    document.getElementById('filterAll').disabled = false;
  }

  document.getElementById('chatEmpty').style.display = '';
  document.getElementById('chatActive').classList.remove('visible');
  document.getElementById('dialogsList').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--text-3);font-size:13px">Загрузка диалогов...</div>';
  await loadDialogs();
}

document.getElementById('accountSel').addEventListener('change', e => {
  if (e.target.value) selectAccount(e.target.value);
});

document.getElementById('refreshDialogsBtn').addEventListener('click', () => {
  loadDialogs();
});

// ── Filter ─────────────────────────────────────────────────────────────────
window.setFilter = function(val) {
  if (!val && allAccountsMode) return; // "Все диалоги" недоступен в режиме всех аккаунтов
  sentOnly = val;
  document.getElementById('filterSent').classList.toggle('active', val);
  document.getElementById('filterAll').classList.toggle('active', !val);
  loadDialogs();
};

// ── Dialogs ────────────────────────────────────────────────────────────────
async function loadDialogs() {
  try {
    if (allAccountsMode) {
      const results = await Promise.all(
        authorizedAccounts.map(a =>
          api('GET', `/api/accounts/${a.account_id}/dialogs?limit=200&sent_only=true`)
            .then(dialogs => dialogs.map(d => ({
              ...d,
              _account_id:   a.account_id,
              _account_name: a.name || a.account_id,
            })))
            .catch(() => [])
        )
      );
      allDialogs = results.flat().sort((a, b) => {
        const da = a.last_message?.date || '';
        const db = b.last_message?.date || '';
        return db < da ? -1 : db > da ? 1 : 0;
      });
    } else {
      allDialogs = await api('GET',
        `/api/accounts/${currentAccount}/dialogs?limit=200&sent_only=${sentOnly}`);
    }
    renderDialogs();
  } catch (e) {
    document.getElementById('dialogsList').innerHTML =
      `<div style="padding:20px;color:var(--error);font-size:13px">${esc(e.message)}</div>`;
  }
}

function renderDialogs() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = q ? allDialogs.filter(d => (d.name || '').toLowerCase().includes(q)) : allDialogs;
  const el = document.getElementById('dialogsList');

  if (list.length === 0) {
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3);font-size:13px">Диалогов нет</div>';
    return;
  }

  el.innerHTML = list.map((d, i) => {
    const init    = (d.name || '?')[0].toUpperCase();
    const preview = d.last_message
      ? (d.last_message.out ? '→ ' : '') + (d.last_message.text || '📎 Медиа')
      : '';
    const time    = d.last_message?.date ? fmtTime(d.last_message.date) : '';
    const badge   = d.unread_count > 0 ? `<div class="d-badge">${d.unread_count}</div>` : '';
    const active  = (currentChat?.id === d.id && currentChat?._account_id === d._account_id) ? 'active' : '';
    const accBadge = allAccountsMode && d._account_name
      ? `<div class="d-account-badge">${esc(d._account_name)}</div>` : '';
    return `<div class="dialog-item ${active}" data-idx="${i}" onclick="openDialog(${i})">
      <div class="d-avatar">${esc(init)}</div>
      <div class="d-info">
        <div class="d-name">${esc(d.name || String(d.id))}</div>
        <div class="d-preview">${esc(preview)}</div>
        ${accBadge}
      </div>
      <div class="d-meta"><div class="d-time">${time}</div>${badge}</div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', renderDialogs);

// ── Open dialog ────────────────────────────────────────────────────────────
window.openDialog = async function(idx) {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = q ? allDialogs.filter(d => (d.name || '').toLowerCase().includes(q)) : allDialogs;
  const dialog = list[idx];
  if (!dialog) return;

  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

  // В режиме всех аккаунтов берём account_id из диалога
  if (allAccountsMode && dialog._account_id) {
    currentAccount = dialog._account_id;
  }

  currentChat = dialog;
  lastMsgId   = 0;

  document.querySelectorAll('.dialog-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-idx="${idx}"]`)?.classList.add('active');

  document.getElementById('chatEmpty').style.display = 'none';
  document.getElementById('chatActive').classList.add('visible');

  document.getElementById('chatAvatar').textContent = (dialog.name || '?')[0].toUpperCase();
  document.getElementById('chatName').textContent   = dialog.name || String(dialog.id);
  document.getElementById('chatSub').textContent    = dialog.username
    ? '@' + dialog.username + (allAccountsMode ? ` · ${dialog._account_name}` : '')
    : 'ID: ' + dialog.id + (allAccountsMode ? ` · ${dialog._account_name}` : '');

  document.getElementById('msgsBody').innerHTML =
    '<div style="text-align:center;color:var(--text-3);font-size:13px;padding:40px">Загрузка...</div>';

  await loadMessages(true);
  pollTimer = setInterval(() => loadMessages(false), 5000);
};

// ── Messages ───────────────────────────────────────────────────────────────
window.loadMessages = async function(scrollToBottom = true) {
  if (!currentAccount || !currentChat) return;
  try {
    const msgs = await api('GET',
      `/api/accounts/${currentAccount}/dialogs/${currentChat.id}/messages?limit=60`);
    renderMessages(msgs, scrollToBottom);
  } catch (e) {
    console.error('loadMessages:', e);
  }
};

function renderMessages(msgs, scrollToBottom) {
  const body = document.getElementById('msgsBody');
  const wasAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
  const newLastId = msgs.length ? msgs[msgs.length - 1].id : 0;
  const hasNew = newLastId !== lastMsgId;

  if (msgs.length === 0) {
    body.innerHTML =
      '<div style="text-align:center;color:var(--text-3);font-size:13px;padding:40px">Нет сообщений</div>';
    return;
  }

  body.innerHTML = msgs.map(m => {
    const inner = `<div>${esc(m.text)}</div><div class="msg-time">${fmtDateTime(m.date)}</div>`;
    if (m.out) {
      return `<div class="msg-wrapper out" data-msg-id="${m.id}" data-msg-text="${m.text.replace(/"/g, '&quot;')}">
        <div class="msg-actions">
          <button class="msg-action-btn" onclick="editMsg(${m.id})" title="Редактировать">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="msg-action-btn del" onclick="deleteMsg(${m.id})" title="Удалить для всех">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>
        <div class="msg out" id="msg_${m.id}">${inner}</div>
      </div>`;
    } else {
      return `<div class="msg-wrapper in">
        <div class="msg in">${inner}</div>
      </div>`;
    }
  }).join('');

  if (scrollToBottom || (wasAtBottom && hasNew)) {
    body.scrollTop = body.scrollHeight;
  }
  lastMsgId = newLastId;
}

// ── Send ───────────────────────────────────────────────────────────────────
window.sendMsg = async function() {
  const inp  = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !currentAccount || !currentChat) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  inp.disabled = true;

  try {
    await api('POST',
      `/api/accounts/${currentAccount}/dialogs/${currentChat.id}/send`,
      { text });
    inp.value = '';
    inp.style.height = '';
    await loadMessages(true);
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
    inp.disabled = false;
    inp.focus();
  }
};

document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
});

document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return (s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function fmtTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

// ── Edit / Delete messages ─────────────────────────────────────────────────
window.editMsg = function(msgId) {
  // Остановить поллинг — иначе перерисовка через 5 сек уничтожит форму
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

  const wrapper = document.querySelector(`.msg-wrapper[data-msg-id="${msgId}"]`);
  if (!wrapper) return;
  const msgDiv = document.getElementById(`msg_${msgId}`);
  const currentText = wrapper.dataset.msgText;

  // Скрыть кнопки действий пока открыта форма
  const actionsEl = wrapper.querySelector('.msg-actions');
  if (actionsEl) actionsEl.style.visibility = 'hidden';

  msgDiv.innerHTML = `
    <div class="msg-edit-wrap">
      <textarea class="msg-edit-textarea" id="editTa_${msgId}">${currentText.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
      <div class="msg-edit-btns">
        <button class="msg-edit-cancel" onclick="cancelEdit()">Отмена</button>
        <button class="msg-edit-save" onclick="saveEdit(${msgId})">Сохранить</button>
      </div>
    </div>`;
  const ta = document.getElementById(`editTa_${msgId}`);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(msgId); }
    if (e.key === 'Escape') cancelEdit();
  });
};

function restartPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = currentChat ? setInterval(() => loadMessages(false), 5000) : null;
}

window.cancelEdit = async function() {
  await loadMessages(false);
  restartPoll();
};

window.saveEdit = async function(msgId) {
  const ta = document.getElementById(`editTa_${msgId}`);
  if (!ta) return;
  const newText = ta.value.trim();
  if (!newText) return;
  ta.disabled = true;
  try {
    await api('PATCH',
      `/api/accounts/${currentAccount}/dialogs/${currentChat.id}/messages/${msgId}`,
      { text: newText });
    await loadMessages(false);
    restartPoll();
  } catch (e) {
    toast('Ошибка редактирования: ' + e.message, 'err');
    ta.disabled = false;
  }
};

window.deleteMsg = async function(msgId) {
  if (!confirm('Удалить сообщение для всех?')) return;
  try {
    await api('DELETE',
      `/api/accounts/${currentAccount}/dialogs/${currentChat.id}/messages/${msgId}`);
    await loadMessages(false);
  } catch (e) {
    toast('Ошибка удаления: ' + e.message, 'err');
  }
};

// ── Init ───────────────────────────────────────────────────────────────────
loadAccounts();
</script>
