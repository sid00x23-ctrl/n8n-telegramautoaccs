name: ${CLIENT_ID}

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      N8N_PORT: "5678"
      N8N_HOST: "0.0.0.0"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://${N8N_DOMAIN}"
      N8N_EDITOR_BASE_URL: "https://${N8N_DOMAIN}/n8n/"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: "1"
    networks:
      - internal

  userbot:
    image: botrassilka-userbot:latest
    restart: unless-stopped
    ports:
      - "${USERBOT_PORT}:8000"
    env_file: .env
    environment:
      HEADLESS: "true"
    volumes:
      - ./sessions:/app/sessions
      - ./accounts_config.json:/app/accounts_config.json
      - /opt/botrassilka/telegram-userbot-service/manager.py:/app/manager.py
      - /opt/botrassilka/telegram-userbot-service/api.py:/app/api.py
    networks:
      - internal

  portal:
    image: botrassilka-portal:latest
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT}:7000"
    command: uvicorn main:app --host 0.0.0.0 --port 7000 --reload
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/botrassilka/portal/static:/app/static
      - /opt/botrassilka/portal/main.py:/app/main.py
    environment:
      PORTAL_USERNAME: "${PORTAL_USERNAME}"
      PORTAL_PASSWORD: "${PORTAL_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      USERBOT_API_URL: "http://userbot:8000"
      USERBOT_CONTAINER: "${CLIENT_ID}-userbot-1"
      N8N_URL: "https://${N8N_DOMAIN}/n8n/"
      N8N_INTERNAL_URL: "http://n8n:5678"
      N8N_OWNER_EMAIL: "${N8N_OWNER_EMAIL}"
      N8N_OWNER_PASSWORD: "${N8N_OWNER_PASSWORD}"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  n8n_data:
  redis_data:

networks:
  internal:
    driver: bridge
